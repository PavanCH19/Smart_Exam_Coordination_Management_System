<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Smart Exam Coordination and Management System</title>

    <!-- Google Fonts: Newsreader (display/serif) + Inter (UI/sans) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;0,6..72,700;1,6..72,500&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap"
      rel="stylesheet"
    />

    <!-- Tailwind CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              ink: {
                50: '#f3f5f8',
                100: '#e4e8ef',
                200: '#c7d0de',
                300: '#9fadc4',
                400: '#7186a6',
                500: '#516789',
                600: '#3f5170',
                700: '#33415a',
                800: '#212d40',
                900: '#141b2c',
                950: '#0b0f1c',
              },
              brass: {
                50: '#fbf6ea',
                100: '#f4e8c9',
                200: '#e9d093',
                300: '#dcb35e',
                400: '#cd9c40',
                500: '#b8863b',
                600: '#996a30',
                700: '#7a5228',
                800: '#5e3f22',
                900: '#4a331e',
              },
              paper: '#f8f6f0',
            },
            fontFamily: {
              display: ['"Newsreader"', 'ui-serif', 'Georgia', 'serif'],
              sans: ['"Inter"', 'ui-sans-serif', 'system-ui', 'sans-serif'],
              mono: ['"JetBrains Mono"', 'ui-monospace', 'monospace'],
            },
            boxShadow: {
              card: '0 1px 2px rgba(11,15,28,0.04), 0 8px 24px -12px rgba(11,15,28,0.18)',
            },
          },
        },
      };
    </script>
  </head>
  <body class="bg-paper text-ink-900 font-sans antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
